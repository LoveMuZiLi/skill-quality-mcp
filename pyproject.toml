[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-quality-mcp"
version = "1.2.0"
description = "MCP server: Agent Skills checks + dependency analysis + SonarQube bug detection + code quality ratings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3"]
keywords = ["mcp", "agent-skills", "sonarqube", "code-quality", "cursor", "codex"]

authors = [{ name = "LoveMuZiLi" }]

[project.urls]
Homepage = "https://github.com/LoveMuZiLi/skill-quality-mcp"
Repository = "https://github.com/LoveMuZiLi/skill-quality-mcp"
Issues = "https://github.com/LoveMuZiLi/skill-quality-mcp/issues"

[project.scripts]
skill-quality-mcp = "skill_quality_mcp.server:main"

[tool.setuptools.packages.find]
where = ["plugins/skill-quality"]
include = ["skill_quality_mcp*"]
